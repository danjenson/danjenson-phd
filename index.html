<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dan Jenson's personal website.">
    <meta name="theme-color" content="#6750a4">
    <title>Dan Jenson</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Roboto, Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d1b20;
        background: #fffbfe;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        min-height: 64px;
        padding: 0 24px;
        display: flex;
        align-items: center;
        background: #f7f2fa;
        box-shadow: 0 1px 3px rgb(0 0 0 / 20%);
        font-size: 1.25rem;
        font-weight: 500;
      }

      main {
        width: min(100% - 32px, 720px);
        margin: auto;
        padding: 48px 0;
      }

      article {
        padding: clamp(32px, 7vw, 64px);
        border-radius: 28px;
        background: #f3edf7;
        box-shadow: 0 2px 6px rgb(0 0 0 / 15%);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }

      p {
        max-width: 52ch;
        margin: 0 0 32px;
        color: #49454f;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      a {
        min-height: 48px;
        padding: 0 24px;
        display: inline-flex;
        align-items: center;
        border-radius: 24px;
        color: #fff;
        background: #6750a4;
        font-weight: 500;
        text-decoration: none;
      }

      a:hover {
        background: #7965af;
      }

      a:focus-visible {
        outline: 3px solid #1d1b20;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <header>danjenson.phd</header>
    <main>
      <article>
        <h1>Dan Jenson</h1>
        <p>Welcome to my personal website. More information will be available here soon.</p>
        <a href="https://github.com/danjenson">View my GitHub</a>
      </article>
    </main>
  </body>
</html>
